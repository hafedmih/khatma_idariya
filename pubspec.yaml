name: khatma_idariya
description: الختمة الإدارية — برنامج أهل شنقيط لختم القرآن كل ٢١ يوماً
publish_to: 'none'
version: 1.0.6+9

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.0
  intl: 0.20.2
  share_plus: 12.0.2
  webview_flutter: ^4.14.0
  supabase_flutter: ^2.8.4
  pdfx: ^2.9.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  image_picker: ^1.1.2
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  path_provider: ^2.1.5
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/ahzab.json
    - assets/links.json
    - assets/pdf/

# ── أيقونة التطبيق (Android + iOS) ──
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true        # iOS لا يقبل قناة الشفافية
  min_sdk_android: 21

# ── شاشة البداية (Splash) ──
# نستخدم أيقونة ذات هوامش حتى لا يقصّها قناع الدائرة في أندرويد 12+
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/splash_icon.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/icon/splash_icon.png"
